<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Viewer</title>
    <link rel="stylesheet" href="./assets/style.css">
    <!-- Marked.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <header>
        <a href="./index.html" class="back-link">← 一覧に戻る</a>
    </header>

    <main id="content" class="markdown-body">
        <p>読み込み中...</p>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const fileName = params.get('file');

            if (!fileName) {
                document.getElementById('content').innerHTML = '<p>ファイルが指定されていません。</p>';
                return;
            }

            try {
                // documents フォルダ内の対象 md ファイルを取得
                const response = await fetch(`./documents/${fileName}`);
                if (!response.ok) throw new Error('File not found');
                
                const text = await response.text();
                // フロントマター（ヘッダー定義 --- ... ---）を除外してマークダウン部のみ変換
                const markdownText = text.replace(/^---[\s\S]*?---\n/, '');
                document.getElementById('content').innerHTML = marked.parse(markdownText);
            } catch (error) {
                document.getElementById('content').innerHTML = `<p>エラー: ドキュメントの読み込みに失敗しました (${error.message})</p>`;
            }
        });
    </script>
</body>
</html>
